name: Prepare Topic (explainer video)

# Step 1 of 2. Type a topic idea; this finds recent articles, takes screenshots, downloads a
# data chart (FRED) and logos, and drafts the script with a free local AI model (Ollama).
# Everything is committed to input/topics/<date>-<topic>/ so you can review and edit it.
# Step 2: run "Generate Whiteboard Video" with topic_dir = that folder.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic idea, e.g. why buying a house got harder"
        required: true
      region:
        description: "News region: US, GB, PK, AE or IN"
        required: false
        default: "US"
      languages:
        description: "Scripts to draft: english, urdu (Urdu script, best pronunciation), roman_urdu"
        required: false
        default: "english,urdu"
      model:
        description: "Local AI model (Ollama) that drafts the script"
        required: false
        type: choice
        options: ["qwen2.5:7b", "qwen2.5:3b", "none"]
        default: "qwen2.5:7b"
      max_articles:
        description: "Article screenshots to capture"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: prepare-topic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IN_TOPIC: ${{ inputs.topic }}
      IN_REGION: ${{ inputs.region }}
      IN_LANGS: ${{ inputs.languages }}
      IN_MODEL: ${{ inputs.model }}
      IN_MAX: ${{ inputs.max_articles }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-optional.txt

      - name: Install Cairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libcairo2-dev pkg-config

      - name: Install Python packages and headless Chromium
        run: |
          pip install -r requirements-lock.txt playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Restore AI model cache
        if: inputs.model != 'none'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.model }}-v1

      - name: Start local AI model
        if: inputs.model != 'none'
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true  # run our own server so models land in the cached folder
          mkdir -p "$HOME/.ollama/models"
          (OLLAMA_MODELS="$HOME/.ollama/models" ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$IN_MODEL"

      - name: Collect evidence and draft the script
        id: prep
        run: |
          max="$IN_MAX"; [[ "$max" =~ ^[0-9]+$ ]] || max=2
          python -m engine.explainer.prepare --topic "$IN_TOPIC" --region "${IN_REGION:-US}" \
            --languages "${IN_LANGS:-english,urdu}" --model "$IN_MODEL" --max-articles "$max"

      - name: Commit the topic folder
        env:
          TOPIC_DIR: ${{ steps.prep.outputs.topic_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TOPIC_DIR"
          git commit -m "Topic: $IN_TOPIC" -m "Prepared by the Prepare Topic workflow. Review $TOPIC_DIR/notes.md before rendering."
          git pull --rebase --autostash
          git push
          {
            echo ""
            echo "**Next:** review \`$TOPIC_DIR\`, then run **Generate Whiteboard Video** with \`topic_dir\` = \`$TOPIC_DIR\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload topic folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-topic
          path: input/topics/
          if-no-files-found: warn
          retention-days: 14
