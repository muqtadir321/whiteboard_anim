name: Prepare Topic (explainer video)

# One click: type a topic idea; this finds recent articles, takes screenshots, downloads a data
# chart (FRED) and logos, drafts the script with a free local AI model (Ollama), commits it to
# input/topics/<date>-<topic>/ and renders the video in your cloned voice (artifact
# "whiteboard-video-output"). Set render to false to review the scripts first, then run
# "Generate Whiteboard Video" with topic_dir = that folder.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic idea, e.g. why buying a house got harder (also the news search words)"
        required: true
      script_dir:
        description: "Your own scripts: folder with english.txt / urdu.txt (e.g. input/topics/my-video). Blank = AI drafts them"
        required: false
        default: ""
      region:
        description: "News region: US, GB, PK, AE or IN"
        required: false
        default: "US"
      languages:
        description: "Scripts to draft: english, urdu (Urdu script, best pronunciation), roman_urdu"
        required: false
        default: "english,urdu"
      model:
        description: "Local AI model (Ollama) that drafts the script"
        required: false
        type: choice
        options: ["qwen2.5:7b", "qwen2.5:14b", "qwen2.5:3b", "none"]
        default: "qwen2.5:7b"
      max_articles:
        description: "Article screenshots to capture"
        required: false
        default: "2"
      render:
        description: "Render the video right away (false = stop after the scripts so you can review them)"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write

concurrency:
  group: prepare-topic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      topic_dir: ${{ steps.prep.outputs.topic_dir }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      IN_TOPIC: ${{ inputs.topic }}
      IN_REGION: ${{ inputs.region }}
      IN_LANGS: ${{ inputs.languages }}
      IN_MODEL: ${{ inputs.model }}
      IN_MAX: ${{ inputs.max_articles }}
      IN_RENDER: ${{ inputs.render }}
      IN_SCRIPT_DIR: ${{ inputs.script_dir }}
      WHITEBOARD_CACHE: ${{ github.workspace }}/.model-cache/whiteboard
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-optional.txt

      - name: Install Cairo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libcairo2-dev pkg-config

      - name: Install Python packages and headless Chromium
        run: |
          pip install -r requirements-lock.txt playwright==1.48.0 fastembed==0.9.0
          python -m playwright install --with-deps chromium

      - name: Restore meaning-matcher cache (model + drawings)
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: explainer-semantic-v1-${{ hashFiles('requirements-optional.txt') }}
          restore-keys: explainer-semantic-v1-

      - name: Restore AI model cache
        if: inputs.model != 'none'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.model }}-v1

      - name: Start local AI model
        if: inputs.model != 'none'
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true  # run our own server so models land in the cached folder
          mkdir -p "$HOME/.ollama/models"
          (OLLAMA_MODELS="$HOME/.ollama/models" ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$IN_MODEL"

      - name: Collect evidence and draft the script
        id: prep
        run: |
          max="$IN_MAX"; [[ "$max" =~ ^[0-9]+$ ]] || max=2
          auto=(); [ "$IN_RENDER" != "false" ] && auto=(--auto)  # no review step: drop unverified sentences
          [ -n "$IN_SCRIPT_DIR" ] && auto+=(--script-dir "$IN_SCRIPT_DIR")  # your own words, tags placed automatically
          python -m engine.explainer.prepare --topic "$IN_TOPIC" --region "${IN_REGION:-US}" \
            --languages "${IN_LANGS:-english,urdu}" --model "$IN_MODEL" --max-articles "$max" "${auto[@]}"

      - name: Commit the topic folder
        id: commit
        env:
          TOPIC_DIR: ${{ steps.prep.outputs.topic_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TOPIC_DIR"
          git commit -m "Topic: $IN_TOPIC" -m "Prepared by the Prepare Topic workflow. Review $TOPIC_DIR/notes.md before rendering."
          git pull --rebase --autostash
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$IN_RENDER" = "false" ]; then
            next="review \`$TOPIC_DIR\`, then run **Generate Whiteboard Video** with \`topic_dir\` = \`$TOPIC_DIR\`."
          else
            next="the video is rendering in the **render** job; download **whiteboard-video-output** when it finishes."
          fi
          printf '\n**Next:** %s\n' "$next" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload topic folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-topic
          path: input/topics/
          if-no-files-found: warn
          retention-days: 14

  render:
    needs: prepare
    if: inputs.render != 'false'
    uses: ./.github/workflows/0-make-video.yml
    secrets: inherit  # VOICE_REFERENCE_URL for cloning
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      topic_dir: ${{ needs.prepare.outputs.topic_dir }}
      target_languages: ${{ inputs.script_dir != '' && 'auto' || inputs.languages }}
